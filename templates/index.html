<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Weather</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><main class="app-shell"><header><p class="eyebrow">CURRENT CONDITIONS</p><h1>AI Weather</h1><p>Search a city for live weather and a practical AI summary.</p></header>
<form id="weather-form" novalidate><label for="city">City</label><div class="search-row"><input id="city" name="city" type="text" maxlength="100" placeholder="e.g., Delhi" autocomplete="address-level2" required><button type="submit">Check weather</button></div></form>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="result" class="result" hidden aria-live="polite"><div class="weather-card"><div><p id="location" class="location"></p><p id="condition" class="condition"></p></div><img id="weather-icon" alt="" hidden><p><span id="temperature" class="temperature"></span><span>°C</span></p><dl><div><dt>Feels like</dt><dd id="feels-like"></dd></div><div><dt>Humidity</dt><dd id="humidity"></dd></div><div><dt>Wind</dt><dd id="wind"></dd></div><div><dt>Visibility</dt><dd id="visibility"></dd></div></dl></div><article class="ai-card"><h2>AI weather note</h2><p id="ai-explanation"></p><p id="ai-warning" class="warning" hidden></p></article></section></main><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
